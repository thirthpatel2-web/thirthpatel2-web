<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Thirth Patel - ISE (AI and Robotics) at Presidency University. Applied AI, full-stack, civic tech. Shipping CivicLens for Smart India Hackathon 2026.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a3a"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3b4a7a" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="900" height="330" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .type { clip-path: inset(0 100% 0 0); animation: type 1.1s steps(40, end) forwards; }
    @keyframes show { to { opacity: 1; } }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(370px); } }
    .orbit { animation: spin 14s linear infinite; transform-origin: 780px 112px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .d1 { animation-delay: .3s; }  .d2 { animation-delay: 1.4s; }
    .d3 { animation-delay: 2.1s; } .d4 { animation-delay: 3.2s; }
    .d5 { animation-delay: 3.9s; } .d6 { animation-delay: 5.0s; }
    .d7 { animation-delay: 5.7s; }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="330" fill="url(#bg)"/>
    <rect width="900" height="330" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="900" height="40" fill="#58a6ff" opacity="0.05"/>

    <!-- orbiting "robotics" motif -->
    <g opacity="0.9">
      <circle cx="780" cy="112" r="58" fill="none" stroke="#bc8cff" stroke-width="1.2" stroke-dasharray="4 7" opacity="0.6"/>
      <circle cx="780" cy="112" r="34" fill="none" stroke="#58a6ff" stroke-width="1.2" opacity="0.5"/>
      <circle class="pulse" cx="780" cy="112" r="14" fill="#58a6ff" filter="url(#glow)"/>
      <g class="orbit">
        <circle cx="838" cy="112" r="6" fill="#ff7eb6"/>
        <circle cx="746" cy="112" r="4" fill="#3fb950"/>
      </g>
    </g>

    <!-- name -->
    <text class="sans" x="44" y="78" font-size="46" font-weight="800" fill="url(#name)" filter="url(#glow)" letter-spacing="1">Thirth Patel</text>
    <text class="sans" x="46" y="108" font-size="16" fill="#9fb3d9">ISE · AI &amp; Robotics · Presidency University, Bengaluru</text>

    <!-- terminal -->
    <g transform="translate(40,124)">
      <rect width="620" height="192" rx="12" fill="#0d1117" stroke="#30363d"/>
      <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
      <circle cx="38" cy="18" r="5.5" fill="#febc2e"/>
      <circle cx="56" cy="18" r="5.5" fill="#28c840"/>
      <text class="mono" x="310" y="22" font-size="11" fill="#6e7681" text-anchor="middle">thirth@github: ~</text>

      <g class="mono" font-size="14.5">
        <text class="line d1" x="18" y="56"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~ </tspan></text>
        <text class="type d1" x="52" y="56" fill="#e6edf3">whoami</text>
        <text class="type d2" x="18" y="78" fill="#c9d1d9">3rd-year ISE (AI &amp; Robotics) · AI/ML + full-stack developer</text>

        <text class="line d3" x="18" y="106"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~ </tspan></text>
        <text class="type d3" x="52" y="106" fill="#e6edf3">cat focus.txt</text>
        <text class="type d4" x="18" y="128" fill="#d2a8ff">applied AI  ·  LLM + RAG systems  ·  computer vision  ·  civic tech</text>

        <text class="line d5" x="18" y="156"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~ </tspan></text>
        <text class="type d5" x="52" y="156" fill="#e6edf3">./now</text>
        <text class="type d6" x="104" y="156" fill="#ffa657">shipping CivicLens for Smart India Hackathon 2026 🚀</text>
        <text class="line d7" x="18" y="180"><tspan fill="#3fb950">➜</tspan><tspan fill="#58a6ff"> ~ </tspan></text>
      </g>
      <rect class="line d7" x="52" y="167" width="9" height="17" fill="#58a6ff"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- stats chips -->
    <g class="sans" font-size="12.5" font-weight="600">
      <g transform="translate(690,196)">
        <rect width="170" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="85" y="20" fill="#3fb950" text-anchor="middle">● 10 public projects</text>
      </g>
      <g transform="translate(690,234)">
        <rect width="170" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="85" y="20" fill="#58a6ff" text-anchor="middle">◆ SIH 2026 · CODEXXA</text>
      </g>
      <g transform="translate(690,272)">
        <rect width="170" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="85" y="20" fill="#ff7eb6" text-anchor="middle">▲ Bengaluru, India</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="329" rx="18" fill="none" stroke="#30363d"/>
</svg>
