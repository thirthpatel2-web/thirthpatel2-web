<svg xmlns="http://www.w3.org/2000/svg" width="560" height="84" viewBox="0 0 560 84" role="img" aria-label="Explore my portfolio">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset=".33" stop-color="#bc8cff"/><stop offset=".66" stop-color="#ff7eb6"/><stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1033"/></linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="4" y="4" width="552" height="76" rx="38"/></clipPath>
    <filter id="g" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="5" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(7px) } }
    .arr { animation: nudge 1.2s ease-in-out infinite; }
  </style>
  <rect x="3" y="3" width="554" height="78" rx="39" fill="url(#f)" stroke="url(#b)" stroke-width="3" filter="url(#g)"/>
  <g clip-path="url(#c)">
    <rect x="-160" y="0" width="120" height="84" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-200;700" dur="3.2s" repeatCount="indefinite"/></rect>
  </g>
  <text x="44" y="52" font-family="'JetBrains Mono',Consolas,monospace" font-size="15" fill="#8b949e">▸</text>
  <text x="66" y="52" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#f0f6fc" letter-spacing="1.5">EXPLORE MY PORTFOLIO</text>
  <g class="arr"><text x="470" y="53" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="800" fill="#ff7eb6">→</text></g>
</svg>
