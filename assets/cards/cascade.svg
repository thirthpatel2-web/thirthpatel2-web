<svg xmlns="http://www.w3.org/2000/svg" width="480" height="230" viewBox="0 0 480 230" role="img" aria-label="Cascade Failure Env: AI agents · distributed systems">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff7b72"/><stop offset="0.5" stop-color="#ffa657"/><stop offset="1" stop-color="#ff7b72"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffa657" stop-opacity="0.45"/><stop offset="1" stop-color="#ffa657" stop-opacity="0"/></radialGradient>
  <clipPath id="c"><rect x="3" y="3" width="474" height="224" rx="18"/></clipPath>
</defs>
<style>
  @keyframes in { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform: translateY(0) } }
  .in { opacity:0; animation: in .8s cubic-bezier(.2,.8,.2,1) 0.15s forwards; }
  @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(5px) } }
  .arrow { animation: nudge 1.6s ease-in-out infinite; }
</style>
<g class="in">
  <rect x="1.5" y="1.5" width="477" height="227" rx="20" fill="url(#bg)" stroke="url(#bd)" stroke-width="2.5"/>
  <g clip-path="url(#c)">
    <circle cx="440" cy="30" r="120" fill="url(#orb)"><animate attributeName="r" values="100;130;100" dur="6s" repeatCount="indefinite"/></circle>
    <rect x="-200" y="0" width="160" height="230" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" values="-260;600" dur="4.5s" begin="0.65s" repeatCount="indefinite"/></rect>
  </g>
  <text x="26" y="52" font-size="30">🚨</text>
  <text x="70" y="47" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#f0f6fc">Cascade Failure Env</text>
  <text x="70" y="70" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="12.5" fill="#ff7b72">AI agents · distributed systems</text>
  <text x="28" y="118" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" fill="#c9d1d9">An OpenEnv benchmark where AI agents play on-call</text><text x="28" y="139" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" fill="#c9d1d9">engineer: detect, diagnose and recover cascading</text><text x="28" y="160" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14.5" fill="#c9d1d9">failures across 12 services.</text>
  <g transform="translate(28,186)"><rect width="60" height="24" rx="12" fill="#ff7b72" fill-opacity="0.14" stroke="#ff7b72" stroke-opacity="0.45"/><text x="30" y="16.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" fill="#ff7b72">Python</text></g><g transform="translate(96,186)"><rect width="83" height="24" rx="12" fill="#ff7b72" fill-opacity="0.14" stroke="#ff7b72" stroke-opacity="0.45"/><text x="41" y="16.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" fill="#ff7b72">AI agents</text></g><g transform="translate(187,186)"><rect width="60" height="24" rx="12" fill="#ff7b72" fill-opacity="0.14" stroke="#ff7b72" stroke-opacity="0.45"/><text x="30" y="16.5" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="11.5" fill="#ff7b72">Docker</text></g>
  <g class="arrow"><text x="450" y="52" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#ffa657">view ↗</text></g>
</g>
</svg>